<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: Arial, 'Malgun Gothic', sans-serif; fill: #222; }
      .title { font-size: 28px; font-weight: 700; }
      .box { fill: #fff; stroke: #2f6f4e; stroke-width: 3; rx: 10; }
      .node { font-size: 20px; font-weight: 700; }
      .sub { font-size: 15px; fill: #555; }
      .arrow { stroke: #333; stroke-width: 3; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <text x="550" y="45" text-anchor="middle" class="title">GreenFarm System Architecture</text>

  <rect x="50" y="130" width="160" height="110" class="box"/>
  <text x="130" y="177" text-anchor="middle" class="node">작업자</text>
  <text x="130" y="205" text-anchor="middle" class="sub">Tray 선택 / 작업 명령</text>

  <rect x="270" y="120" width="190" height="130" class="box"/>
  <text x="365" y="165" text-anchor="middle" class="node">PyQt Dashboard</text>
  <text x="365" y="195" text-anchor="middle" class="sub">UI 상태 표시</text>
  <text x="365" y="220" text-anchor="middle" class="sub">QProcess 실행</text>

  <rect x="520" y="95" width="230" height="180" class="box"/>
  <text x="635" y="135" text-anchor="middle" class="node">ROS 2 작업 노드</text>
  <text x="635" y="165" text-anchor="middle" class="sub">soil check / next step</text>
  <text x="635" y="190" text-anchor="middle" class="sub">flatten / plant pick-place</text>
  <text x="635" y="215" text-anchor="middle" class="sub">manual control / emergency stop</text>
  <text x="635" y="240" text-anchor="middle" class="sub">stdout 로그 / 종료 상태 반환</text>

  <rect x="810" y="120" width="210" height="130" class="box"/>
  <text x="915" y="165" text-anchor="middle" class="node">Doosan ROS 2</text>
  <text x="915" y="195" text-anchor="middle" class="sub">Service / DSR API</text>
  <text x="915" y="220" text-anchor="middle" class="sub">movej / movel / IO</text>

  <rect x="390" y="340" width="320" height="110" class="box"/>
  <text x="550" y="382" text-anchor="middle" class="node">M0609 + Tool + Tray</text>
  <text x="550" y="412" text-anchor="middle" class="sub">그리퍼 / 누름판 / 삽 / 식물 / 토양 / 장애물</text>

  <path d="M210 185 H270" class="arrow"/>
  <path d="M460 185 H520" class="arrow"/>
  <path d="M750 185 H810" class="arrow"/>
  <path d="M915 250 C915 330 760 395 710 395" class="arrow"/>

  <path d="M520 245 C455 300 455 330 500 340" stroke="#2f6f4e" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)" fill="none"/>
  <text x="430" y="300" class="sub">로그/상태 반영</text>
</svg>
